<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بيع التمور بالجملة</title>
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --cream:#F6EEDD; --brown:#3B2412; --brown-soft:#5A3A22;
  --gold:#C6892E; --gold-deep:#9A6A1F; --line:#E1D3B2; --white:#FFFDF8;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--brown);font-family:'Cairo',sans-serif;min-height:100vh;font-size:17px;line-height:1.5}
h1,h2,.brand{font-family:'Markazi Text',serif}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 40px}
header{padding:20px 18px 14px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:38px;font-weight:700;margin:0}
.account-btn{background:var(--white);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-family:Cairo;font-size:16px;color:var(--brown)}
.section-title{font-size:25px;font-weight:600;margin:24px 0 12px}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.product{display:flex;justify-content:space-between;align-items:center;gap:12px}
.product-info h3{margin:0 0 4px;font-size:19px;font-weight:600}
.product-info .price{color:var(--gold-deep);font-weight:700}
.badge{font-size:14px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--brown-soft)}
.badge.out{color:#a33;border-color:#e3b3b3}
.qty-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.qty-row input{width:80px;padding:10px;border:1px solid var(--line);border-radius:8px;font-family:Cairo;font-size:17px;background:var(--white);color:var(--brown)}
.qty-row span{font-size:15px;color:var(--brown-soft)}
.add-btn{margin-top:10px;width:100%;padding:13px;border:none;border-radius:8px;background:var(--gold);color:var(--white);font-family:Cairo;font-weight:700;font-size:17px}
#cart-bar{position:sticky;bottom:0;background:var(--brown);color:var(--cream);padding:12px 18px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:space-between;align-items:center;border-radius:14px 14px 0 0;margin-top:10px}
#cart-bar button{background:var(--gold);color:var(--white);border:none;padding:9px 18px;border-radius:8px;font-family:Cairo;font-weight:700}
label{display:block;margin:12px 0 6px;font-size:16px;color:var(--brown-soft)}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-family:Cairo;font-size:17px;background:var(--white);color:var(--brown)}
.submit-btn{margin-top:16px;width:100%;padding:15px;border:none;border-radius:10px;background:var(--brown);color:var(--cream);font-family:Cairo;font-weight:700;font-size:18px}
.msg{margin-top:12px;padding:10px;border-radius:8px;font-size:16px}
.msg.ok{background:#DDF0D8;color:#2B5A20}
.msg.err{background:#F5D8D8;color:#8A2020}
.empty{color:var(--brown-soft);text-align:center;padding:20px;font-size:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--white);color:var(--brown);font-family:Cairo}
.tabs button.active{background:var(--brown);color:var(--cream)}
.order-item{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px;font-size:15px;display:flex;justify-content:space-between}
.status-tag{font-size:14px;padding:3px 11px;border-radius:999px;background:var(--cream);border:1px solid var(--line)}
.hidden{display:none}
.link-btn{background:none;border:none;color:var(--gold-deep);font-family:Cairo;font-size:16px;text-decoration:underline;padding:0;margin-top:10px}
.overlay{position:fixed;inset:0;background:var(--cream);display:flex;align-items:stretch;justify-content:center;padding:0;z-index:10}
.modal{background:var(--cream);border-radius:0;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:480px;height:100%;max-height:100%;overflow:auto}
.close-x{float:left;background:none;border:none;font-size:26px;color:var(--brown-soft);padding:4px 8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand">بيع التمور بالجملة</h1>
    <button class="account-btn" id="account-btn" onclick="openAccount()">حسابي</button>
  </header>
  <div style="text-align:center;color:var(--brown-soft);font-size:16px;margin-top:-8px">أسعار الجملة، توصيل لكل ولايات الجزائر</div>

  <div class="section-title">المنتجات</div>
  <div id="products"><div class="empty">جارٍ تحميل المنتجات...</div></div>

  <div id="cart-bar" style="display:none">
    <span id="cart-summary"></span>
    <button onclick="goToCheckout()">إتمام الطلب</button>
  </div>

  <div id="checkout-section" class="hidden">
    <div class="section-title">إتمام الطلب</div>
    <form class="card" id="order-form" onsubmit="submitOrder(event)">
      <label>الاسم الكامل</label><input type="text" id="c-name" required>
      <label>رقم الهاتف</label><input type="tel" id="c-phone" required>
      <label>الولاية</label><input type="text" id="c-wilaya" required>
      <label>البلدية</label><input type="text" id="c-commune">
      <label>العنوان</label><textarea id="c-address" rows="2"></textarea>
      <label>ملاحظات</label><textarea id="c-notes" rows="2"></textarea>
      <button type="submit" class="submit-btn" id="submit-btn">إرسال الطلب</button>
      <div id="form-msg"></div>
    </form>
  </div>
</div>

<div class="overlay hidden" id="account-overlay">
  <div class="modal">
    <button class="close-x" onclick="closeAccount()">×</button>

    <div id="auth-box">
      <div class="tabs">
        <button id="tab-login" class="active" onclick="switchTab('login')">دخول</button>
        <button id="tab-signup" onclick="switchTab('signup')">حساب جديد</button>
      </div>
      <div id="pane-login">
        <label>البريد الإلكتروني</label><input type="email" id="li-email">
        <label>كلمة السر</label><input type="password" id="li-pass">
        <button class="submit-btn" onclick="doLogin()">دخول</button>
      </div>
      <div id="pane-signup" class="hidden">
        <label>الاسم الكامل</label><input type="text" id="su-name">
        <label>البريد الإلكتروني</label><input type="email" id="su-email">
        <label>كلمة السر</label><input type="password" id="su-pass">
        <label>رقم الهاتف</label><input type="tel" id="su-phone">
        <label>الولاية</label><input type="text" id="su-wilaya">
        <button class="submit-btn" onclick="doSignup()">إنشاء حساب</button>
      </div>
      <div id="auth-msg"></div>
    </div>

    <div id="profile-box" class="hidden">
      <h2 style="font-size:24px;margin:0 0 10px" id="profile-name"></h2>
      <div class="section-title" style="font-size:20px;margin-top:10px">طلباتي</div>
      <div id="my-orders"><div class="empty">جارٍ التحميل...</div></div>
      <button class="link-btn" onclick="doLogout()">تسجيل الخروج</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://qumkwkcmrqaxtpxeqvsh.supabase.co";
const ANON_KEY = "sb_publishable_ME44tbcx1xz_YB0f_9HOLA_AltULtyV";
const sb = supabase.createClient(SUPABASE_URL, ANON_KEY);

let products = [], stock = {};
const cart = {};
const statusLabel = {new:'جديد', confirmed:'مؤكد', shipped:'في الطريق', delivered:'تم التسليم', cancelled:'ملغى'};

async function loadCatalog(){
  try{
    const { data: p } = await sb.from('date_products').select('id,name,description,price_per_kg').eq('is_active', true);
    const { data: s } = await sb.from('stock_status').select('product_id,in_stock');
    products = p || [];
    (s||[]).forEach(r => stock[r.product_id] = r.in_stock);
    renderProducts();
  }catch(e){
    document.getElementById('products').innerHTML = '<div class="empty">تعذّر تحميل المنتجات</div>';
  }
}

function renderProducts(){
  const el = document.getElementById('products');
  if(!products.length){ el.innerHTML = '<div class="empty">لا توجد منتجات متاحة حالياً</div>'; return; }
  el.innerHTML = products.map(p => {
    const inStock = stock[p.id] !== false;
    return `<div class="card">
      <div class="product">
        <div class="product-info"><h3>${p.name}</h3><div class="price">${Number(p.price_per_kg).toLocaleString('ar-DZ')} دج / كغ</div></div>
        <span class="badge ${inStock?'':'out'}">${inStock?'متوفر':'غير متوفر'}</span>
      </div>
      ${p.description ? `<div style="font-size:15px;color:var(--brown-soft);margin-top:6px">${p.description}</div>` : ''}
      <div class="qty-row"><input type="number" min="1" id="qty-${p.id}" ${inStock?'':'disabled'} placeholder="كغ"><span>الكمية بالكيلوغرام</span></div>
      <button class="add-btn" ${inStock?'':'disabled'} onclick="addToCart('${p.id}')">أضف إلى الطلب</button>
    </div>`;
  }).join('');
}

function addToCart(id){
  const input = document.getElementById('qty-'+id);
  const qty = Number(input.value);
  if(!qty || qty<=0){ input.focus(); return; }
  cart[id] = qty;
  updateCartBar();
}
function updateCartBar(){
  const bar = document.getElementById('cart-bar');
  const entries = Object.entries(cart);
  if(!entries.length){ bar.style.display='none'; return; }
  document.getElementById('cart-summary').textContent = `${entries.length} منتج · ${entries.reduce((s,[,q])=>s+q,0)} كغ`;
  bar.style.display='flex';
}

async function goToCheckout(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ openAccount(); return; }
  document.getElementById('checkout-section').classList.remove('hidden');
  document.getElementById('checkout-section').scrollIntoView({behavior:'smooth'});
  prefillFromProfile();
}

async function prefillFromProfile(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user) return;
  const { data: c } = await sb.from('date_customers').select('*').eq('auth_user_id', user.id).maybeSingle();
  if(c){
    document.getElementById('c-name').value = c.name || '';
    document.getElementById('c-phone').value = c.phone || '';
    document.getElementById('c-wilaya').value = c.wilaya || '';
    document.getElementById('c-commune').value = c.commune || '';
    document.getElementById('c-address').value = c.address || '';
  }
}

async function submitOrder(e){
  e.preventDefault();
  const items = Object.entries(cart).map(([product_id, quantity_kg]) => ({product_id, quantity_kg}));
  const msg = document.getElementById('form-msg');
  if(!items.length){ msg.className='msg err'; msg.textContent='أضف منتجاً واحداً على الأقل'; return; }
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ openAccount(); return; }
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'جارٍ الإرسال...';
  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/create-order`, {
      method:'POST',
      headers:{ apikey: ANON_KEY, Authorization:'Bearer '+session.access_token, 'Content-Type':'application/json' },
      body: JSON.stringify({
        customer: {
          name: document.getElementById('c-name').value,
          phone: document.getElementById('c-phone').value,
          wilaya: document.getElementById('c-wilaya').value,
          commune: document.getElementById('c-commune').value,
          address: document.getElementById('c-address').value,
        },
        items, notes: document.getElementById('c-notes').value
      })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error);
    msg.className='msg ok';
    msg.textContent = `تم استلام طلبك بنجاح (رقم: ${data.order_id.slice(0,8)}). سنتواصل معك قريباً.`;
    Object.keys(cart).forEach(k=>delete cart[k]);
    updateCartBar();
  }catch(err){
    msg.className='msg err'; msg.textContent='تعذّر إرسال الطلب، حاول مرة أخرى.';
  }finally{
    btn.disabled=false; btn.textContent='إرسال الطلب';
  }
}

function openAccount(){ document.getElementById('account-overlay').classList.remove('hidden'); refreshAccountView(); }
function closeAccount(){ document.getElementById('account-overlay').classList.add('hidden'); }
function switchTab(t){
  document.getElementById('tab-login').classList.toggle('active', t==='login');
  document.getElementById('tab-signup').classList.toggle('active', t==='signup');
  document.getElementById('pane-login').classList.toggle('hidden', t!=='login');
  document.getElementById('pane-signup').classList.toggle('hidden', t!=='signup');
}

async function refreshAccountView(){
  const { data:{ session } } = await sb.auth.getSession();
  const authBox = document.getElementById('auth-box');
  const profileBox = document.getElementById('profile-box');
  const accountBtn = document.getElementById('account-btn');
  if(session){
    authBox.classList.add('hidden'); profileBox.classList.remove('hidden');
    accountBtn.textContent = 'حسابي';
    const { data: c } = await sb.from('date_customers').select('*').eq('auth_user_id', session.user.id).maybeSingle();
    document.getElementById('profile-name').textContent = c?.name ? `مرحباً، ${c.name}` : 'حسابي';
    loadMyOrders();
  }else{
    authBox.classList.remove('hidden'); profileBox.classList.add('hidden');
    accountBtn.textContent = 'دخول / حساب';
  }
}

async function doSignup(){
  const msg = document.getElementById('auth-msg');
  const email = document.getElementById('su-email').value;
  const password = document.getElementById('su-pass').value;
  const name = document.getElementById('su-name').value;
  const phone = document.getElementById('su-phone').value;
  const wilaya = document.getElementById('su-wilaya').value;
  if(!email || !password || !name || !phone || !wilaya){
    msg.className='msg err'; msg.textContent='عبّئ كل الحقول'; return;
  }
  const { error } = await sb.auth.signUp({ email, password, options: { data: { name, phone, wilaya } } });
  if(error){ msg.className='msg err'; msg.textContent = error.message; return; }
  msg.className='msg ok'; msg.textContent='تم إنشاء الحساب، جارٍ الدخول...';
  const { error: loginErr } = await sb.auth.signInWithPassword({ email, password });
  if(loginErr){
    msg.className='msg err';
    msg.textContent = 'تم إنشاء الحساب، لكن يجب تأكيد بريدك الإلكتروني أولاً (تحقق من صندوق الوارد)، ثم سجّل الدخول من تبويب "دخول".';
    return;
  }
  refreshAccountView();
}

async function doLogin(){
  const msg = document.getElementById('auth-msg');
  const email = document.getElementById('li-email').value;
  const password = document.getElementById('li-pass').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    msg.className='msg err';
    msg.textContent = error.message?.toLowerCase().includes('confirm')
      ? 'يجب تأكيد بريدك الإلكتروني أولاً، تحقق من صندوق الوارد'
      : 'بريد إلكتروني أو كلمة سر غير صحيحة';
    return;
  }
  msg.textContent=''; refreshAccountView();
}

async function doLogout(){
  await sb.auth.signOut();
  refreshAccountView();
}

async function loadMyOrders(){
  const el = document.getElementById('my-orders');
  const { data, error } = await sb
    .from('date_orders')
    .select('id,status,total_amount,created_at,date_order_items(quantity_kg,unit_price,date_products(name))')
    .order('created_at', { ascending:false });
  if(error || !data || !data.length){ el.innerHTML = '<div class="empty">لا توجد طلبات بعد</div>'; return; }
  el.innerHTML = data.map(o => `<div class="card">
    <div style="display:flex;justify-content:space-between">
      <span>${new Date(o.created_at).toLocaleDateString('ar-DZ')}</span>
      <span class="status-tag">${statusLabel[o.status]||o.status}</span>
    </div>
    ${(o.date_order_items||[]).map(i => `<div class="order-item"><span>${i.date_products?.name||''} × ${i.quantity_kg}كغ</span><span>${(i.quantity_kg*i.unit_price).toLocaleString('ar-DZ')} دج</span></div>`).join('')}
    <div class="order-item" style="font-weight:700"><span>المجموع</span><span>${Number(o.total_amount).toLocaleString('ar-DZ')} دج</span></div>
  </div>`).join('');
}

sb.auth.onAuthStateChange(() => refreshAccountView());
loadCatalog();
refreshAccountView();
</script>
</body>
</html>
